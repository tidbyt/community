name: Build and Test

on:
  pull_request:
    branches:
      - "**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup build agent
        run: ./.github/scripts/setup.sh

      - name: Determine targets
        id: targets
        run: ./.github/scripts/determine-targets.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Check modified apps
        run: ./.github/scripts/check-apps.sh
        env:
          TARGETS: "${{ steps.targets.outputs.targets }}"

      - name: Test Polymarket behavior and rendering
        if: contains(steps.targets.outputs.targets, 'apps/polymarket')
        run: |
          python3 -m pip install --target "${{ runner.temp }}/polymarket-deps" -r apps/polymarket/tests/requirements.txt
          PYTHONPATH="${{ runner.temp }}/polymarket-deps" python3 apps/polymarket/tests/test_app.py --output "${{ runner.temp }}/polymarket-tests"

      - name: Upload Polymarket render proofs
        if: always() && contains(steps.targets.outputs.targets, 'apps/polymarket')
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-render-proofs
          path: ${{ runner.temp }}/polymarket-tests
          if-no-files-found: ignore
