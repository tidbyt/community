name: Bunco Facts Check

on:
  push:
    branches:
      - add-bunco-facts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install WebP dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebp-dev

      - name: Install the Pixlet version used by Tidbyt
        run: go install tidbyt.dev/pixlet@v0.34.0

      - name: Check Bunco Facts for publishing
        run: pixlet check apps/buncofacts/buncofacts.star

      - name: Render preview
        run: pixlet render apps/buncofacts/buncofacts.star --gif --magnify 10

      - name: Save preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: buncofacts-preview
          path: apps/buncofacts/buncofacts.gif
          if-no-files-found: warn
